<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PRD.ai - New PRD Wizard</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary-fixed": "#001a33",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-container": "#2e2040",
                      "on-tertiary-container": "#00334d",
                      "on-secondary-fixed": "#1a1030",
                      "on-tertiary": "#ffffff",
                      "on-background": "#2e1a28",
                      "background": "#fef7ff",
                      "tertiary-container": "#40c0ee",
                      "on-secondary-fixed-variant": "#4a3068",
                      "on-primary-fixed": "#3d0028",
                      "on-primary-container": "#2e1a28",
                      "inverse-surface": "#2e1a28",
                      "on-error": "#ffffff",
                      "tertiary-fixed": "#c8eaff",
                      "primary-fixed": "#ffd6ee",
                      "tertiary": "#0096cc",
                      "on-surface-variant": "#604868",
                      "primary-fixed-dim": "#f0a0cc",
                      "surface-container-high": "#f2e8f2",
                      "primary-container": "#f080c0",
                      "surface-container": "#f8eef8",
                      "secondary": "#7c52aa",
                      "surface": "#fef7ff",
                      "surface-container-highest": "#ece2ec",
                      "outline-variant": "#dcc8e0",
                      "error": "#e53e3e",
                      "surface-bright": "#fef7ff",
                      "secondary-fixed": "#eedcff",
                      "secondary-container": "#eedcff",
                      "on-surface": "#2e1a28",
                      "primary": "#e040a0",
                      "on-tertiary-fixed-variant": "#005580",
                      "error-container": "#ffe8e8",
                      "surface-variant": "#f2e8f2",
                      "surface-dim": "#e0d6e0",
                      "secondary-fixed-dim": "#c8a8e8",
                      "on-error-container": "#9b1c1c",
                      "surface-tint": "#e040a0",
                      "inverse-primary": "#f0a0cc",
                      "tertiary-fixed-dim": "#80d0f0",
                      "on-primary-fixed-variant": "#a02070",
                      "outline": "#907898",
                      "on-primary": "#ffffff",
                      "on-secondary": "#ffffff",
                      "surface-container-low": "#fbf2fb",
                      "inverse-on-surface": "#fef7ff"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": [
                              "DM Sans", "sans-serif"
                      ],
                      "display": [
                              "DM Sans", "sans-serif"
                      ],
                      "body": [
                              "DM Sans", "sans-serif"
                      ],
                      "label": [
                              "DM Sans", "sans-serif"
                      ]
              },
              "fontSize": {}
      },
          },
        }
      </script>
<style>
        body { font-family: 'DM Sans', sans-serif; }
        /* Subtle joyful pattern background */
        .bg-pattern {
            background-color: #fef7ff;
            background-image: radial-gradient(#e040a0 0.5px, transparent 0.5px), radial-gradient(#40c0ee 0.5px, transparent 0.5px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            opacity: 0.8;
        }
      </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col md:flex-row relative">
<!-- Intent is Linear/Transactional (Wizard), but user requested SideNavBar in components so we must render it if it's considered part of the main app experience. However, the rule states "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional...". I will suppress the SideNav and TopAppBar to focus on the Wizard canvas as per the Semantic Shell Mandate. -->
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center p-6 md:p-12 min-h-screen bg-pattern">
<!-- Wizard Container (Card) -->
<div class="w-full max-w-3xl bg-surface-container-lowest rounded-xl shadow-[0_8px_32px_rgba(224,64,160,0.1)] p-8 md:p-12 relative overflow-hidden transition-transform duration-300 ease-out hover:shadow-[0_12px_40px_rgba(224,64,160,0.15)]">
<!-- Decorative Header Accent -->
<div class="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-primary via-tertiary to-secondary"></div>
<!-- Header -->
<div class="text-center mb-10 mt-4">
<h1 class="font-headline text-4xl font-bold text-on-background tracking-tight mb-2">Let's craft your PRD!</h1>
<p class="text-on-surface-variant text-lg">Step 2: Define your goals and who you're building for.</p>
</div>
<!-- Progress Bar -->
<div class="mb-12 relative">
<div class="flex justify-between mb-2">
<span class="text-label-md font-bold text-primary">Project Name</span>
<span class="text-label-md font-bold text-primary">Goal &amp; Audience</span>
<span class="text-label-md font-medium text-outline">Key Features</span>
</div>
<div class="w-full bg-surface-container-high rounded-full h-4 relative">
<div class="bg-gradient-to-r from-primary to-secondary h-4 rounded-full w-1/2 shadow-[0_2px_8px_rgba(224,64,160,0.4)]"></div>
</div>
<!-- Step Indicators -->
<div class="absolute top-6 left-0 w-full flex justify-between px-2">
<div class="w-6 h-6 bg-primary rounded-full flex items-center justify-center -ml-3 -mt-5 shadow-[0_2px_8px_rgba(224,64,160,0.3)]">
<span class="material-symbols-outlined text-on-primary text-sm font-bold">check</span>
</div>
<div class="w-6 h-6 bg-secondary rounded-full flex items-center justify-center -mt-5 shadow-[0_2px_8px_rgba(124,82,170,0.3)] border-4 border-surface-container-lowest">
</div>
<div class="w-6 h-6 bg-surface-container-high rounded-full flex items-center justify-center -mr-3 -mt-5">
</div>
</div>
</div>
<!-- Form Content -->
<form class="space-y-8">
<!-- Input Group: Primary Goal -->
<div class="space-y-3">
<label class="block font-label text-lg font-bold text-on-background" for="primary_goal">What is the primary goal of this project?</label>
<textarea class="w-full bg-surface-container rounded-lg border-2 border-transparent focus:border-primary focus:ring-0 text-on-surface p-4 text-lg transition-all duration-200 resize-none hover:bg-surface-container-highest" id="primary_goal" placeholder="e.g., Increase user retention by 20% by simplifying the onboarding flow." rows="3"></textarea>
<p class="text-sm text-on-surface-variant pl-2">Try to be specific and measurable if possible.</p>
</div>
<!-- Input Group: Target Audience -->
<div class="space-y-3">
<label class="block font-label text-lg font-bold text-on-background" for="target_audience">Who is your target audience?</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-4 text-tertiary">groups</span>
<input class="w-full bg-surface-container rounded-lg border-2 border-transparent focus:border-primary focus:ring-0 text-on-surface py-4 pl-12 pr-4 text-lg transition-all duration-200 hover:bg-surface-container-highest" id="target_audience" placeholder="e.g., Freelance designers, Small business owners..." type="text"/>
</div>
</div>
<!-- Selection Chips: Platform -->
<div class="space-y-3">
<label class="block font-label text-lg font-bold text-on-background">Target Platforms</label>
<div class="flex flex-wrap gap-3">
<button class="px-6 py-2 rounded-full border-2 border-primary bg-primary-container text-on-primary-container font-bold hover:scale-105 transition-transform duration-200 ease-out flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">desktop_windows</span>
                            Web
                        </button>
<button class="px-6 py-2 rounded-full border-2 border-outline-variant bg-surface text-on-surface-variant font-medium hover:scale-105 transition-transform duration-200 ease-out hover:border-primary flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-sm">smartphone</span>
                            iOS
                        </button>
<button class="px-6 py-2 rounded-full border-2 border-outline-variant bg-surface text-on-surface-variant font-medium hover:scale-105 transition-transform duration-200 ease-out hover:border-primary flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-sm">android</span>
                            Android
                        </button>
<button class="px-6 py-2 rounded-full border-2 border-outline-variant bg-surface text-on-surface-variant font-medium hover:scale-105 transition-transform duration-200 ease-out hover:border-primary flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-sm">watch</span>
                            Wearable
                        </button>
</div>
</div>
<!-- Actions -->
<div class="pt-8 flex justify-between items-center border-t border-outline-variant/30 mt-10">
<button class="px-6 py-3 rounded-full text-secondary font-bold hover:bg-secondary-container transition-colors duration-200 flex items-center gap-2" type="button">
<span class="material-symbols-outlined">arrow_back</span>
                        Back
                    </button>
<button class="px-8 py-4 rounded-full bg-primary text-on-primary font-bold text-lg shadow-[0_4px_16px_rgba(224,64,160,0.25)] hover:scale-105 hover:shadow-[0_6px_24px_rgba(224,64,160,0.35)] transition-all duration-200 ease-out flex items-center gap-2" type="button">
                        Next: Key Features
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Contextual Help / Mascot -->
<div class="fixed bottom-8 right-8 hidden md:block">
<button class="w-16 h-16 bg-tertiary rounded-full shadow-[0_8px_24px_rgba(0,150,204,0.3)] flex items-center justify-center hover:scale-110 transition-transform duration-300 ease-out group relative">
<span class="material-symbols-outlined text-on-tertiary text-3xl" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
<!-- Tooltip -->
<div class="absolute bottom-full right-0 mb-4 w-48 bg-inverse-surface text-inverse-on-surface p-3 rounded-lg text-sm shadow-xl opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none">
                    Need help defining your audience? Click here for AI suggestions!
                </div>
</button>
</div>
</main>
</body></html>
